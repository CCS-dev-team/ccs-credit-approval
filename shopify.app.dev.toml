client_id = "41d14c005fa4d321f1231c005bd1e34f"
name = "ccs-credit-approval"
application_url = "https://example.com"
embedded = true

[webhooks]
api_version = "2026-10"

[[webhooks.subscriptions]]
uri = "/webhooks/app/uninstalled"
topics = [ "app/uninstalled" ]

[[webhooks.subscriptions]]
uri = "/webhooks/app/scopes_update"
topics = [ "app/scopes_update" ]

[[webhooks.subscriptions]]
uri = "/webhooks/draft-orders"
topics = [ "draft_orders/create", "draft_orders/update", "draft_orders/delete" ]

[access_scopes]
scopes = "read_customers,read_draft_orders,write_draft_orders,write_metaobject_definitions,write_metaobjects,write_products"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
automatically_update_urls_on_dev = true
