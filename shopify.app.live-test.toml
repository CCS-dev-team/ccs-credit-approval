# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "760a26cdb268249597ffaaa3ca22d982"
application_url = "https://ccs-credit-approval-prod.onrender.com"
embedded = true
name = "ccs-credit-live-test"

[access_scopes]
scopes = "read_customers,write_metaobject_definitions,write_metaobjects,write_products,read_draft_orders,write_draft_orders"

[auth]
redirect_urls = [
  "https://ccs-credit-approval-prod.onrender.com/auth/callback",
  "https://ccs-credit-approval-prod.onrender.com/auth/shopify/callback",
  "https://ccs-credit-approval-prod.onrender.com/api/auth/callback"
]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/draft-orders"
  topics = [ "draft_orders/create", "draft_orders/update", "draft_orders/delete" ]

[build]
automatically_update_urls_on_dev = false
